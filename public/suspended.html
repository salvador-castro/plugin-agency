<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Servicio suspendido</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f0f12;
            color: #e8e8ea;
            padding: 24px;
            line-height: 1.6;
        }
        .card {
            max-width: 480px;
            width: 100%;
            text-align: center;
            background: #1a1a1f;
            border: 1px solid #2a2a31;
            border-radius: 16px;
            padding: 48px 32px;
        }
        .icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #2a2a31;
            font-size: 26px;
        }
        h1 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 12px;
        }
        p {
            font-size: 15px;
            color: #a0a0a8;
            margin-bottom: 8px;
        }
        .project {
            font-weight: 600;
            color: #e8e8ea;
        }
        .footer {
            margin-top: 28px;
            font-size: 13px;
            color: #6a6a72;
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="icon" aria-hidden="true">&#9888;</div>
        <h1>Servicio temporalmente suspendido</h1>
        <p>El sitio de <span class="project">[NOMBRE DEL PROYECTO]</span> no se encuentra disponible en este momento.</p>
        <p>Si sos el responsable del proyecto, por favor contactanos para restablecer el servicio.</p>
        <div class="footer">Gracias por tu comprensi&oacute;n.</div>
    </main>
</body>
</html>
